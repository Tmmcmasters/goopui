name: Release

# Manual only. Publishes the committed versions of the public @goopui/* packages
# (core, vue, react, nuxt). Version bumps happen beforehand with `pnpm changeset version`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry_run:
        description: Dry run (pack and validate, don't publish)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04 # check:package-managers: Playwright 1.59 has no Chromium for Ubuntu 26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test --filter=./packages/core --filter=./packages/vue --filter=./packages/react --filter=./packages/nuxt
      # The packed tarballs must install and build with every package manager before publish.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: pnpm check:package-managers
        shell: bash # -o pipefail: tee must not hide the exit code
        run: pnpm check:package-managers 2>&1 | tee package-managers.log
        env:
          TMPDIR: ${{ runner.temp }}
          NEXT_TELEMETRY_DISABLED: 1
          # Not setup-node's publish .npmrc (a placeholder token): the consumer installs read anonymously.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/pm-check.npmrc
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-managers-logs
          path: |
            package-managers.log
            ${{ runner.temp }}/goop-pm.*/*/*.log
          if-no-files-found: ignore
      - name: Publish
        run: >-
          pnpm publish -r --filter "./packages/*"
          --access public
          --tag "$DIST_TAG"
          --no-git-checks
          --provenance
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DIST_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
